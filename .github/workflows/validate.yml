name: Validate skills

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install asset-tool test dependency
        run: python -m pip install -r skills/disciplines/create-game-assets/scripts/requirements.txt
      - name: Validate repository wiring and skills
        run: python scripts/validate-skills.py
      - name: Run regression tests
        run: python -m unittest discover -s tests -v
